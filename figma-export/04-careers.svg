<g id="Why VoltWorks"><rect x="0" y="633" width="1440" height="720" fill="#f8fafc"/><text x="144" y="729" font-family="Inter" font-size="13" font-weight="500" fill="#004fa8" letter-spacing="4.2">WHY VOLTWORKS</text>
<text x="144" y="779" font-family="Space Grotesk" font-size="34" font-weight="700" fill="#001E4D">Join a team that turns</text>
<text x="144" y="823" font-family="Space Grotesk" font-size="34" font-weight="700" fill="#001E4D">industrial ambition into</text>
<text x="144" y="867" font-family="Space Grotesk" font-size="34" font-weight="700" fill="#001E4D">real-world impact.</text>
<text x="144" y="935" font-family="Work Sans" font-size="17" font-weight="400" fill="#334155">Our values aren't just words on a wall; they are the technical</text>
<text x="144" y="963" font-family="Work Sans" font-size="17" font-weight="400" fill="#334155">specifications for how we conduct business and engineering.</text>
<rect x="144" y="963" width="300" height="150" rx="24" fill="#fff" stroke="#e2e8f0"/><text x="168" y="1003" font-family="Space Grotesk" font-size="17" font-weight="600" fill="#001E4D">Comprehensive 360°</text>
<text x="168" y="1026" font-family="Space Grotesk" font-size="17" font-weight="600" fill="#001E4D">solutions</text>
<text x="168" y="1061" font-family="Work Sans" font-size="12.5" font-weight="400" fill="#475569">End-to-end delivery from concept and</text>
<text x="168" y="1081" font-family="Work Sans" font-size="12.5" font-weight="400" fill="#475569">engineering to on-site commissioning.</text>
<rect x="468" y="963" width="300" height="150" rx="24" fill="#fff" stroke="#e2e8f0"/><text x="492" y="1003" font-family="Space Grotesk" font-size="17" font-weight="600" fill="#001E4D">One team, one vision</text>
<text x="492" y="1038" font-family="Work Sans" font-size="12.5" font-weight="400" fill="#475569">Cross-disciplinary collaboration</text>
<text x="492" y="1058" font-family="Work Sans" font-size="12.5" font-weight="400" fill="#475569">focused on practical outcomes.</text>
<rect x="144" y="1133" width="300" height="150" rx="24" fill="#fff" stroke="#e2e8f0"/><text x="168" y="1173" font-family="Space Grotesk" font-size="17" font-weight="600" fill="#001E4D">Relentless innovation</text>
<text x="168" y="1208" font-family="Work Sans" font-size="12.5" font-weight="400" fill="#475569">Practical breakthroughs — better</text>
<text x="168" y="1228" font-family="Work Sans" font-size="12.5" font-weight="400" fill="#475569">performance, lower energy use, smarter</text>
<text x="168" y="1248" font-family="Work Sans" font-size="12.5" font-weight="400" fill="#475569">systems.</text>
<rect x="468" y="1133" width="300" height="150" rx="24" fill="#fff" stroke="#e2e8f0"/><text x="492" y="1173" font-family="Space Grotesk" font-size="17" font-weight="600" fill="#001E4D">Cultivate &amp; share</text>
<text x="492" y="1196" font-family="Space Grotesk" font-size="17" font-weight="600" fill="#001E4D">knowledge</text>
<text x="492" y="1231" font-family="Work Sans" font-size="12.5" font-weight="400" fill="#475569">Open learning and rigorous</text>
<text x="492" y="1251" font-family="Work Sans" font-size="12.5" font-weight="400" fill="#475569">documentation help teams and partners</text>
<text x="492" y="1271" font-family="Work Sans" font-size="12.5" font-weight="400" fill="#475569">grow together.</text>
