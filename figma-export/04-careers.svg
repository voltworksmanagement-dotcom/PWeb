<rect x="0" y="73" width="1440" height="560" fill="rgba(0,30,77,0.72)"/><text x="144" y="173" font-family="Inter" font-size="12" font-weight="500" fill="#1d67cd" letter-spacing="4.8">PRECISION ENGINEERING SINCE 2023</text>
<text x="144" y="233" font-family="Space Grotesk" font-size="46" font-weight="700" fill="#fff">Build the systems that</text>
<text x="144" y="291" font-family="Space Grotesk" font-size="46" font-weight="700" fill="#fff">power tomorrow's</text>
<text x="144" y="349" font-family="Space Grotesk" font-size="46" font-weight="700" fill="#fff">mobility.</text>
<text x="144" y="437" font-family="Work Sans" font-size="17" font-weight="400" fill="rgba(255,255,255,0.85)">At VoltWorks, we are revolutionizing the way motors and controllers work in the</text>
<text x="144" y="465" font-family="Work Sans" font-size="17" font-weight="400" fill="rgba(255,255,255,0.85)">modern world. Our technology is at the forefront of industrial automation, powered</text>
<text x="144" y="493" font-family="Work Sans" font-size="17" font-weight="400" fill="rgba(255,255,255,0.85)">by the expertise of German and Swiss engineers.</text>
<text x="144" y="531" font-family="Work Sans" font-size="14" font-weight="400" fill="rgba(255,255,255,0.75)">We are a team founded by IIT BHU and IIT Delhi alumni focusing on providing</text>
<text x="144" y="555" font-family="Work Sans" font-size="14" font-weight="400" fill="rgba(255,255,255,0.75)">high-performance solutions that drive the future of connected devices.</text>
<g><rect x="144" y="523" width="268" height="56" rx="16" fill="#004fa8"/><text x="278" y="556.4" font-family="Inter" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">See Open Positions  ›</text>
</g>
